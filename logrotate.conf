# Logs never rotated: 30 files and growing, on a box whose disk is the same
# disk the books are written to. A full disk corrupts every write it touches,
# so this is a data-integrity control, not tidiness.
/home/eugene/Projects/AI-Investing/data/*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
