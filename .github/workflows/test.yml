name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # MUST match what production runs (the ProDesk is on 3.14). CI existed
          # from 2026-07-24 and its engine job had NEVER passed: it pinned 3.11
          # while requirements.lock.txt — generated by pip freeze on a 3.14 box —
          # pins numpy==2.5.1, which requires >=3.12. pip died in ~12 seconds on
          # every one of 136 commits. Testing against a Python nobody deploys
          # cannot catch a bug anybody will hit, so the version is matched here
          # rather than the numpy pin being lowered.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: engine/requirements.lock.txt
      - name: Install engine dependencies
        # Installing the LOCK (not requirements.txt) is deliberate: it proves the
        # pinned set is still installable, which is the failure that hid here.
        run: pip install -r engine/requirements.lock.txt
      - name: Run engine test suite
        run: |
          cd engine
          failed=""
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python3 "$t"; then echo "  ok"; else failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi
          echo "all suites passed"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Build dashboard (production)
        working-directory: dashboard
        run: npm run build
